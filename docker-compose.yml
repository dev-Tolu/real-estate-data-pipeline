# ---------------------------
# 📊 Reusable configurations
# ---------------------------
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  image: apache/airflow:3.1.8
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"
    # LocalExecutor runs tasks directly in the scheduler process —
    # no Celery broker or result backend needed
    _PIP_ADDITIONAL_REQUIREMENTS: "dbt-postgres>=1.7.0 great-expectations pandas"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow/logs:/opt/airflow/logs
    - ./airflow/config:/opt/airflow/config
    - ./airflow/plugins:/opt/airflow/plugins
    - ./dbt:/opt/airflow/dbt
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # ---------------------------
  # 🧠 PostgreSQL (Main Database)
  # ---------------------------
  postgres:
    image: postgres:17-alpine
    container_name: realestate-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01-realestate-schema.sql:/docker-entrypoint-initdb.d/01-realestate-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging: *logging

  # ---------------------------
  # 🪣 MinIO (Data Lake)
  # ---------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: realestate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]
    logging: *logging

  # ---------------------------
  # ⚡ Spark (ETL Layer)
  # ---------------------------
  spark-master:
    build: ./spark
    image: realestate-spark
    container_name: realestate-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8082:8080" # WebUI — avoids conflict with airflow-apiserver on 8080
      - "7077:7077" # Spark master port for worker connections
    volumes:
      - spark-data:/bitnami
      - ./spark:/opt/spark-apps:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
    logging: *logging

  spark-worker:
    image: realestate-spark
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    # No container_name - allows scaling
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 3G
          cpus: "1.5"
    logging: *logging

  # ---------------------------
  # ⚡ Redis (Caching Layer)
  # Used by scraper and forecast services — not by Airflow
  # ---------------------------
  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    container_name: realestate-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?err}
    expose:
      - 6379
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # ---------------------------
  # 🕸️ Scraper
  # ---------------------------
  scraper:
    build: ./scraper
    image: realestate-scraper
    container_name: realestate-scraper
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SCRAPER_LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
      SCRAPER_SCHEDULE_INTERVAL: ${SCRAPER_SCHEDULE_INTERVAL:-3600}
      DATA_SOURCE_URLS: ${DATA_SOURCE_URLS}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW}
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "test -f /app/scraper.py"]
    deploy:
      replicas: ${SCRAPER_REPLICAS:-1}
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging: *logging

  # ---------------------------
  # 📈 Forecast
  # ---------------------------
  forecast:
    build: ./forecast
    image: realestate-forecast
    container_name: realestate-forecast
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      FORECAST_HORIZON: ${FORECAST_HORIZON:-90}
      FORECAST_PERIOD: ${FORECAST_PERIOD:-D}
      FORECAST_CONFIDENCE_INTERVAL: ${FORECAST_CONFIDENCE_INTERVAL:-0.95}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "test -f /app/forecast.py"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1"
    logging: *logging

  # ---------------------------
  # 🏗️ dbt (Data Build Tool) - Dev Container
  # ---------------------------
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.latest
    container_name: realestate-dbt
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./dbt:/usr/app/dbt
    restart: unless-stopped
    logging: *logging

  # ---------------------------
  # 📊 Grafana
  # ---------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: realestate-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?err}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    logging: *logging

  # ---------------------------
  # 🌬️ Airflow (Orchestration)
  # ---------------------------
  airflow-postgres:
    image: postgres:17-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?err}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    logging: *logging

  airflow-init:
    <<: *airflow-common
    container_name: realestate-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -v -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/
        /entrypoint airflow config list >/dev/null
        chown -v -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins,config}
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?err}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: realestate-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

  airflow-scheduler:
    <<: *airflow-common
    container_name: realestate-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

  airflow-triggerer:
    <<: *airflow-common
    container_name: realestate-airflow-triggerer
    command: triggerer
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

volumes:
  postgres_data:
  minio-data:
  grafana-data:
  redis-data:
  spark-data:
  airflow-db-data:
