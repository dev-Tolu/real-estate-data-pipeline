# ---------------------------
# 📊 Reusable configurations
# ---------------------------
x-healthcheck-defaults: &healthcheck-defaults
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 20s

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-airflow-common: &airflow-common
  build: ./airflow
  env_file:
    - .env
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
    AIRFLOW__CORE__FERNET_KEY: ""
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://airflow-apiserver:8080/execution/"
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-airflow_jwt_secret}
    AIRFLOW__API_AUTH__JWT_ISSUER: ${AIRFLOW__API_AUTH__JWT_ISSUER:-airflow}
    # --- 1. Connection Strings (Built dynamically) ---
    POSTGRES_DSN: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379/0"

    # --- 2. Pass-through Credentials (from your .env file) ---
    REDIS_PASSWORD: ${REDIS_PASSWORD}
    MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
    MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    S3_BUCKET_RAW: ${S3_BUCKET_RAW:-realestate-raw-data}
    MINIO_ENDPOINT: minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

    # --- 3. Scraper Configuration ---
    SCRAPER_LOG_LEVEL: ${SCRAPER_LOG_LEVEL:-INFO}
    DATA_SOURCE_URLS: ${DATA_SOURCE_URLS}

    # --- 4. Forecast Configuration ---
    FORECAST_HORIZON: ${FORECAST_HORIZON:-90}
    FORECAST_PERIOD: ${FORECAST_PERIOD:-D}
    FORECAST_CONFIDENCE_INTERVAL: ${FORECAST_CONFIDENCE_INTERVAL:-0.95}

    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONFIG: "/opt/airflow/config/airflow.cfg"
  volumes:
    - ${AIRFLOW_PROJ_DIR:-.}/dags:/opt/airflow/dags
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/logs:/opt/airflow/logs
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/config:/opt/airflow/config
    - ${AIRFLOW_PROJ_DIR:-.}/airflow/plugins:/opt/airflow/plugins
    - ${AIRFLOW_PROJ_DIR:-.}/dbt:/opt/airflow/dbt
    - ${AIRFLOW_PROJ_DIR:-.}/scraper/scraper.py:/opt/airflow/include/scraper.py:ro
    - ${AIRFLOW_PROJ_DIR:-.}/forecast/forecast.py:/opt/airflow/include/forecast.py:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    airflow-postgres:
      condition: service_healthy

services:
  # ---------------------------
  # 🧠 PostgreSQL (Main Database)
  # ---------------------------
  postgres:
    image: postgres:17-alpine
    container_name: realestate-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/01-realestate-schema.sql:/docker-entrypoint-initdb.d/01-realestate-schema.sql:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2"
    logging: *logging

  # ---------------------------
  # 🪣 MinIO (Data Lake)
  # ---------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: realestate-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?err}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?err}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "mc", "ready", "local"]
    logging: *logging

  # ---------------------------
  # ⚡ Spark (ETL Layer)
  # ---------------------------
  spark-master:
    build: ./spark
    image: realestate-spark
    container_name: realestate-spark-master
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_DAEMON_JAVA_OPTS: "-Dspark.master.rest.enabled=true"
      SPARK_MASTER_REST_ENABLED: "true"
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "8082:8080" # Spark WebUI (avoids conflict with Airflow on 8080)
      - "7077:7077" # Spark master — worker registration
      - "6066:6066" # Spark REST submission API (used by submit_spark_and_wait)
    volumes:
      - spark-data:/bitnami
      - ./spark:/opt/spark-apps:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
    logging: *logging

  spark-worker:
    image: realestate-spark
    depends_on:
      spark-master:
        condition: service_healthy
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    # No container_name - allows scaling
    deploy:
      replicas: ${SPARK_WORKER_REPLICAS:-2}
      resources:
        limits:
          memory: 5G
          cpus: "1.5"
    logging: *logging

  # ---------------------------
  # ⚡ Redis (Caching Layer)
  # Used by scraper and forecast services — not by Airflow
  # ---------------------------
  redis:
    # Redis is limited to 7.2-bookworm due to licencing change
    # https://redis.io/blog/redis-adopts-dual-source-available-licensing/
    image: redis:7.2-bookworm
    container_name: realestate-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?err}
    expose:
      - 6379
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
    logging: *logging

  # ---------------------------
  # 🏗️ dbt (Data Build Tool) - Dev Container
  # ---------------------------
  dbt:
    image: ghcr.io/dbt-labs/dbt-postgres:1.7.19
    container_name: realestate-dbt
    entrypoint: ["sleep", "infinity"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?err}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?err}
      POSTGRES_DB: ${POSTGRES_DB:?err}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    volumes:
      - ./dbt:/usr/app/dbt
    restart: unless-stopped
    logging: *logging

  # ---------------------------
  # 📊 Grafana
  # ---------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: realestate-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?err}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
    logging: *logging

  # ---------------------------
  # 🌬️ Airflow (Orchestration)
  # ---------------------------
  airflow-postgres:
    image: postgres:17-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?err}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always
    logging: *logging

  airflow-init:
    <<: *airflow-common
    container_name: realestate-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins,config}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs \
                                            /opt/airflow/dags \
                                            /opt/airflow/plugins \
                                            /opt/airflow/config \
                                            /opt/airflow/dbt

        python - <<'PYEOF'
        import psycopg2, os, sys
        conn_str = os.environ["AIRFLOW__DATABASE__SQL_ALCHEMY_CONN"].replace("postgresql+psycopg2://", "postgresql://")
        conn = psycopg2.connect(conn_str)
        cur = conn.cursor()
        cur.execute("SELECT to_regclass('public.alembic_version')")
        exists = cur.fetchone()[0]
        conn.close()
        sys.exit(0 if exists else 1)
        PYEOF

        if [ $? -eq 0 ]; then
          echo "Airflow DB already initialised — skipping migration."
        else
          echo "First boot — running DB migration and user creation."
          /entrypoint airflow db migrate
          /entrypoint airflow users create \
            --username "$${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
            --password "$${_AIRFLOW_WWW_USER_PASSWORD}" \
            --firstname Admin --lastname User \
            --role Admin --email admin@example.com || true
        fi

        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/logs \
                                            /opt/airflow/dags \
                                            /opt/airflow/plugins \
                                            /opt/airflow/config
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?err}
    user: "0:0"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    container_name: realestate-airflow-apiserver
    command: api-server
    ports:
      - "8080:8080"
    healthcheck:
      test:
        ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

  airflow-scheduler:
    <<: *airflow-common
    container_name: realestate-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: realestate-airflow-triggerer
    command: triggerer
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
    logging: *logging

volumes:
  postgres_data:
  minio-data:
  grafana-data:
  redis-data:
  spark-data:
  airflow-db-data:
